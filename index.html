<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Pushpa</title>
    <style>
        /* 1. Page Background Setup */
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffeef2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* 2. Main Card Container */
        .card-container {
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            overflow: hidden;
            background: #fff;
            position: relative;
            z-index: 10;
        }

        .card-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 3. Animated "Sorry Pushpa" Text */
        .animated-text {
            font-size: 2.5rem;
            color: #b81d40;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: pulse 2s infinite ease-in-out;
            text-align: center;
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); color: #e63946; }
        }

        /* 4. Falling Hearts Animation */
        .heart {
            position: fixed;
            top: -10vh;
            font-size: 20px;
            color: #ff4d6d;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* 5. Floating Teddy Bear Container */
        .teddy-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            z-index: 20;
            animation: floatTeddy 4s infinite ease-in-out;
            text-align: center;
        }

        .teddy-container img {
            width: 100%;
            height: auto;
        }

        @keyframes floatTeddy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* 6. Music Play Button */
        .music-btn {
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #b81d40;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(184, 29, 64, 0.3);
            transition: 0.3s;
            z-index: 10;
        }

        .music-btn:hover {
            background-color: #e63946;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="animated-text">I'm So Sorry, Pushpa... 💔</div>

    <div class="card-container">
        <img src="card.png" alt="Sorry Card for Pushpa">
    </div>

    <button class="music-btn" onclick="toggleMusic()">🎵 Play Our Song</button>
    <audio id="bg-music" src="music.mp3" loop></audio>

    <div class="teddy-container">
        <img src="https://i.imgur.com/eG9mOsz.png" alt="Cute Teddy Bear">
    </div>

    <script>
        // 1. Music Autoplay Workaround
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.querySelector('.music-btn');
            if (music.paused) {
                music.play();
                btn.innerHTML = "⏸️ Pause Music";
            } else {
                music.pause();
                btn.innerHTML = "🎵 Play Our Song";
            }
        }

        // 2. Generating Falling Hearts Dynamically
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Randomly select a heart style
            const heartTypes = ['❤️', '💖', '💝', '💕'];
            heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            
            // Random horizontal positioning and sizing
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s"; // between 2s and 5s
            heart.style.fontSize = Math.random() * 15 + 15 + "px"; // between 15px and 30px
            heart.style.opacity = Math.random() * 0.5 + 0.5; // slight transparency variety
            
            document.body.appendChild(heart);
            
            // Remove heart from DOM after animation finishes to prevent lag
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Generate a new heart every 300 milliseconds
        setInterval(createHeart, 300);
    </script>

</body>
</html>
